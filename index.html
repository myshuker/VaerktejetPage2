<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookmedical – Værktøjs status</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="brand">
    <div class="brand__row">
      <img src="images/logo.png" alt="Cook Medical logo" class="brand__logo">
      <h1 class="brand__name">Cookmedical</h1>
    </div>
    <p class="brand__tagline">Værktøjs status </p>
    <p class="brand__meta">
      <span id="today-date"></span>
    </p>
  </header>

  <main class="lookup">
    <form id="lookup-form" class="lookup__form" autocomplete="off">
      <label for="tool-input" class="lookup__label">Værktøjet nummer</label>
      <div class="lookup__row">
        <input
          type="text"
          id="tool-input"
          class="lookup__input"
          placeholder="fx. EQ00011597 eller 52580"
          inputmode="text"
        >
        <button type="submit" class="lookup__button">Søg</button>
      </div>
    </form>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>Data: D00174522-Rev103.xlsx, D00018073-Rev075.xlsx</p>
  </footer>

  <script src="data.js"></script>
  <script src="process_data.js"></script>
  <script src="script.js"></script>
</body>
</html>
