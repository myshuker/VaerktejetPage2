<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cookmedical – Værktøjs status</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/favicon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="images/favicon-180.png">
<link rel="shortcut icon" href="images/favicon.ico">
<link rel="stylesheet" href="style.css?v=39">
<script>
  // Set light/dark mode before the page is drawn: saved choice, else the system setting
  (function () {
    let theme = null;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (!theme) theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    document.documentElement.dataset.theme = theme;
  })();
</script>
</head>
<body>

  <header class="brand">
    <button type="button" id="theme-toggle" class="theme-toggle"></button>
    <div class="brand__row">
      <img src="images/logo.png" alt="Cook Medical logo" class="brand__logo">
      <h1 class="brand__name">Cookmedical</h1>
    </div>
    <p class="brand__tagline">Værktøjs status</p>
    <p class="brand__meta">
      <span id="today-date"></span>
    </p>
  </header>

  <main class="lookup">
    <form id="lookup-form" class="lookup__form" autocomplete="off">
      <label for="tool-input" class="lookup__label">Værktøjet nummer eller navn</label>
      <div class="suggest">
        <input
          type="text"
          id="tool-input"
          class="lookup__input"
          placeholder="fx. 52580 eller Balloon machine"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="name-suggestions"
        >
        <ul id="name-suggestions" class="suggestions" role="listbox" hidden></ul>
      </div>

      <div class="lookup__buttons">
        <button type="submit" class="lookup__button">Søg</button>
        <button type="button" id="scan-button" class="lookup__button lookup__button--scan" hidden>Scan</button>
      </div>
    </form>

    <div id="scanner" class="scanner" hidden>
      <div class="scanner__box">
        <video id="scanner-video" class="scanner__video" playsinline muted></video>
        <p class="scanner__text">Hold telefonen ca. 15–20 cm fra stregkoden</p>
        <button type="button" id="scanner-close" class="lookup__button">Luk</button>
      </div>
    </div>

    <section id="result" class="result" aria-live="polite"></section>
  </main>

  <footer class="footer">
    <p>Data: D00174522-Rev105.xlsx, D00018073-Rev075.xlsx, værktøj.xlsx</p>
  </footer>

  <script src="data.js?v=39"></script>
  <script src="asset-data.js?v=39"></script>
  <script src="zxing.min.js?v=39"></script>
  <script src="script.js?v=39"></script>
</body>
</html>
